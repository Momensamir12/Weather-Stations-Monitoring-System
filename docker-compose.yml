# Weather Stations Monitoring System: full stack in one command.
#
#   docker compose up --build -d                        # core pipeline
#   docker compose --profile analytics up --build -d    # + Elasticsearch & Kibana
#
name: weather-stations

# ---------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVER: broker:29092           # in-network listener (not localhost:9092)
  SCHEMA_REGISTRY_URL: http://schema-registry:8081

x-station: &station
  build:
    context: .
    dockerfile: WeatherStation/Dockerfile
  image: weather-station:latest
  restart: on-failure
  depends_on:
    schema-registry:
      condition: service_healthy

services:
  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------
  broker:
    image: confluentinc/cp-kafka:7.6.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"                              # host access via localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_KAFKASTORE_TIMEOUT_MS: 10000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -------------------------------------------------------------------------
  # Data producers
  # -------------------------------------------------------------------------
  open-meteo-adapter:
    build:
      context: .
      dockerfile: OpenMeteoAdapter/Dockerfile
    image: open-meteo-adapter:latest
    restart: on-failure
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      <<: *kafka-env
      OPEN_METEO_URL: https://api.open-meteo.com/v1/forecast

  station-1:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "1" }
  station-2:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "2" }
  station-3:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "3" }
  station-4:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "4" }
  station-5:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "5" }
  station-6:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "6" }
  station-7:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "7" }
  station-8:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "8" }
  station-9:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "9" }
  station-10:
    <<: *station
    environment: { <<: *kafka-env, STATION_ID: "10" }

  # -------------------------------------------------------------------------
  # Consumer / processing
  # -------------------------------------------------------------------------
  base-central-station:
    build:
      context: .
      dockerfile: BaseCentralStation/Dockerfile
    image: base-central-station:latest
    restart: on-failure
    user: "${UID:-1000}:${GID:-1000}"   # run as the host user so ./data is writable
    depends_on:
      schema-registry:
        condition: service_healthy
    environment:
      <<: *kafka-env
      BITCASK_DATA_DIR: /data/bitcask
      PARQUET_OUTPUT_DIR: /data/parquet
    volumes:
      - ./data:/data
  # -------------------------------------------------------------------------
  # Optional analytics (docker compose --profile analytics up)
  # -------------------------------------------------------------------------
  elasticsearch:
    profiles: ["analytics"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    profiles: ["analytics"]
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  esdata: